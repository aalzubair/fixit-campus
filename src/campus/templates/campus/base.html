<!-- Base layout for every FixIt Campus page: loads Bootstrap 5 and shows the site name above a centred card. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FixIt Campus{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 32rem;">
    <h1 class="h3 text-center text-primary fw-bold mb-4">FixIt Campus</h1>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        {% block content %}{% endblock %}
      </div>
    </div>
  </main>
</body>
</html>
