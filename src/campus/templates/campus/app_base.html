<!-- Wide layout for the complaint pages (FR-06 to FR-10, FR-21): the navbar of the UI design with Submit Complaint, Existing Complaints and My Complaints. Kept apart from base.html so the login and registration pages stay as they are. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FixIt Campus{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-md bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand text-primary fw-bold" href="{% url 'home' %}">FixIt Campus</a>
      <div class="d-flex flex-wrap align-items-center gap-3">
        <a class="nav-link{% block nav_submit %}{% endblock %}" href="{% url 'submit_complaint' %}">Submit Complaint</a>
        <a class="nav-link{% block nav_existing %}{% endblock %}" href="{% url 'existing_complaints' %}">Existing Complaints</a>
        <a class="nav-link{% block nav_mine %}{% endblock %}" href="{% url 'my_complaints' %}">My Complaints</a>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="small text-secondary">{{ user.username }} · {{ user.get_role_display }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-primary">Log out</button>
        </form>
      </div>
    </div>
  </nav>
  <main class="container py-4" style="max-width: 64rem;">
    {% block content %}{% endblock %}
  </main>
  <script id="bfcache-reload">
    // Why: after Log out, the browser's Back button can restore this page from
    // its back-forward cache without asking the server, despite no-cache
    // headers. Reloading makes the server check the login again (FR-03 AC 2).
    window.addEventListener("pageshow", function (event) {
      if (event.persisted) {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
